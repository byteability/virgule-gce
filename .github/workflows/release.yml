name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v1.0.0)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  auto-tag:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Determine latest tag
        id: latest_tag
        run: |
          git fetch --tags
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            latest="v0.0.0"
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Determine version bump from PR title
        id: bump
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          title_upper=$(echo "$PR_TITLE" | tr '[:lower:]' '[:upper:]')
          if [[ "$title_upper" == *"BREAKING CHANGE"* ]]; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif [[ "$title_upper" == *"FEAT:"* ]]; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute new tag
        id: new_tag
        run: |
          version="${{ steps.latest_tag.outputs.latest }}"
          version="${version#v}"
          IFS='.' read -r major minor patch <<< "$version"
          case "${{ steps.bump.outputs.type }}" in
            major)
              major=$((major + 1)); minor=0; patch=0
              ;;
            minor)
              minor=$((minor + 1)); patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac
          echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.new_tag.outputs.tag }}"
          git push origin "${{ steps.new_tag.outputs.tag }}"

  build-and-release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          
      - name: Install Dependencies
        working-directory: .
        run: npm ci || npm install
        
      - name: Build Extension
        working-directory: .
        run: npm run build
        
      - name: Zip Extension
        run: zip -r virgule.zip dist/
        
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: virgule.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
